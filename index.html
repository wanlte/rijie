<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="入账本">
<meta name="format-detection" content="telephone=no">
<title>入账本</title>
<style>
:root{
  --bg:#0A0A0F;
  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.07);
  --stroke:rgba(255,255,255,.10);
  --stroke-2:rgba(255,255,255,.16);
  --text:#EDEDF2;
  --muted:#8A8A99;
  --dim:#5C5C6B;
  --violet:#7C5CFF;
  --cyan:#22D3EE;
  --ok:#34D399;
  --r:16px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:radial-gradient(720px 420px at 50% -120px,rgba(124,92,255,.13),transparent 70%);
  background-repeat:no-repeat;
  color:var(--text);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;padding:0;}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;}
ul{margin:0;padding:0;list-style:none;}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;}

/* ===== 顶栏 ===== */
.bar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  padding-top:calc(14px + env(safe-area-inset-top));
  background:rgba(10,10,15,.72);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--stroke);
}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;letter-spacing:.01em;}
.brand i{
  width:14px;height:14px;border-radius:4px;display:block;
  background:linear-gradient(135deg,var(--violet),var(--cyan));
  box-shadow:0 0 14px rgba(124,92,255,.55);
}
.streak{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em;}
.streak b{color:var(--cyan);font-weight:500;font-size:14px;}
.bar-r{display:flex;align-items:center;gap:9px;}
.syn{display:inline-block;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.14);transition:background .25s;}
.syn.ok{background:var(--ok);box-shadow:0 0 9px rgba(52,211,153,.55);}
.syn.busy{background:var(--cyan);animation:blink 1s ease-in-out infinite;}
.syn.err{background:#E0705E;box-shadow:0 0 8px rgba(224,112,94,.5);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}

/* ===== 主区 ===== */
#view{flex:1;padding:0 16px 128px;}

.vhead{padding:24px 2px 14px;}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;}
.vhead h1{font-size:27px;line-height:1.25;margin-top:6px;}
.vlead{margin:8px 0 0;font-size:13.5px;line-height:1.75;color:var(--muted);}

.seclabel{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:26px 2px 12px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);
}
.seclabel em{font-style:normal;letter-spacing:.06em;color:var(--muted);}

/* ===== 今天：配额条 ===== */
.quota{margin:18px 2px 0;}
.qbar{display:flex;gap:5px;}
.qbar i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.09);transition:background .25s;}
.qbar i.on{background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 10px rgba(34,211,238,.35);}
.qmeta{
  display:flex;justify-content:space-between;gap:10px;margin-top:10px;
  font-family:var(--mono);font-size:11px;color:var(--dim);
}
.qmeta b{color:var(--text);font-weight:500;}

/* ===== 任务卡 ===== */
.task{
  position:relative;display:flex;gap:12px;align-items:flex-start;
  padding:15px 14px;margin-bottom:11px;
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:var(--r);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:opacity .18s,border-color .18s,transform .18s;
}
.task.done{opacity:.72;}
.task.done .t-title{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(237,237,242,.3);}
.t-body{flex:1;min-width:0;}
.t-title{font-size:15.5px;font-weight:600;line-height:1.5;}
.t-first{margin-top:5px;font-size:12.5px;line-height:1.65;color:var(--muted);display:flex;gap:7px;align-items:baseline;}
.t-first b{
  flex:0 0 auto;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.06em;
  color:var(--cyan);background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.22);
  border-radius:5px;padding:1px 5px;
}
.t-steps{margin-top:9px;display:flex;flex-direction:column;gap:1px;}
.step{
  display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:7px 0;min-height:34px;
}
.step i{
  flex:0 0 16px;height:16px;margin-top:2px;border-radius:5px;
  border:1px solid var(--stroke-2);display:flex;align-items:center;justify-content:center;
  font-size:10px;color:transparent;transition:all .18s;
}
.step span{font-size:13.5px;line-height:1.55;color:var(--text);}
.step.on i{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.55);color:var(--ok);}
.step.on span{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(237,237,242,.25);}
.t-foot{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;
  font-family:var(--mono);font-size:10.5px;color:var(--dim);
}
.t-foot .dot{width:3px;height:3px;border-radius:50%;background:var(--stroke-2);}
.t-foot button{font-family:var(--mono);font-size:10.5px;color:var(--muted);min-height:32px;padding:0 2px;}
.t-foot button.danger{color:#E0705E;}

.seal{
  flex:0 0 auto;width:56px;height:56px;border-radius:50%;
  border:1.2px dashed rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:600;color:var(--text);
  transition:all .2s;
  margin-top:2px;
}
.seal.on{
  border-style:solid;border-color:rgba(52,211,153,.6);
  background:rgba(52,211,153,.12);color:var(--ok);
  box-shadow:0 0 20px rgba(52,211,153,.18);
}
.task.pop{animation:pop 420ms cubic-bezier(.2,1.4,.4,1),flash 620ms ease-out;}

/* ===== 小票 ===== */
.ticket{
  margin-top:16px;padding:16px 15px 14px;border-radius:var(--r);
  background:linear-gradient(180deg,rgba(124,92,255,.07),rgba(255,255,255,.02));
  border:1px solid rgba(124,92,255,.22);
}
.ticket-head{
  display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);
  padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08);
}
.ticket-row{
  display:flex;justify-content:space-between;gap:12px;
  padding:9px 0;font-size:13.5px;color:var(--text);
  border-bottom:1px dashed rgba(255,255,255,.07);
}
.ticket-row b{font-family:var(--mono);font-weight:500;color:var(--ok);}
.ticket-row.bonus b{color:var(--cyan);}
.ticket-total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px;}
.ticket-total span{font-size:12px;color:var(--muted);}
.ticket-total strong{
  font-family:var(--mono);font-size:30px;font-weight:500;
  background:linear-gradient(120deg,var(--violet),var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.ticket-foot{font-size:11.5px;color:var(--dim);line-height:1.7;}

/* ===== 空状态 ===== */
.empty{padding:38px 8px 30px;text-align:center;}
.orb{
  width:96px;height:96px;margin:0 auto 24px;border-radius:50%;
  background:radial-gradient(circle at 50% 44%,rgba(214,204,255,.98),rgba(124,92,255,.62) 34%,rgba(34,211,238,.22) 60%,transparent 74%);
  filter:blur(9px);
  box-shadow:0 0 64px 12px rgba(124,92,255,.16);
  animation:breathe 4.5s ease-in-out infinite;
}
.empty h2{font-size:19px;letter-spacing:-.01em;}
.empty p{margin:9px auto 0;max-width:300px;font-size:13px;line-height:1.75;color:var(--muted);}
.empty .btn{margin-top:18px;}

/* ===== 按钮 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:46px;padding:0 20px;border-radius:12px;
  background:linear-gradient(120deg,var(--violet),#5B8CFF 55%,var(--cyan));
  color:#0A0A0F;font-size:14px;font-weight:700;letter-spacing:.01em;
  box-shadow:0 8px 24px -10px rgba(124,92,255,.7);
  transition:transform .12s,opacity .2s;
}
.btn:active{transform:scale(.97);}
.btn.ghost{
  background:var(--glass);color:var(--text);border:1px solid var(--stroke);
  box-shadow:none;font-weight:500;
}
.btn.sm{min-height:40px;padding:0 15px;font-size:13px;border-radius:10px;}
.btn[disabled]{opacity:.4;pointer-events:none;}

/* ===== 表单 ===== */
.form{margin-top:14px;padding:16px 15px;border-radius:var(--r);background:var(--glass);border:1px solid var(--stroke);}
.f-label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--dim);margin-bottom:7px;}
.f-in{
  width:100%;min-height:46px;padding:11px 13px;margin-bottom:13px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--stroke);border-radius:12px;
  font-size:16px;line-height:1.5;color:var(--text);
  transition:border-color .15s,background .15s;
}
.f-in:focus{outline:none;border-color:rgba(124,92,255,.6);background:rgba(124,92,255,.05);}
.f-in::placeholder{color:#4E4E5C;font-size:14px;}
textarea.f-in{min-height:96px;resize:vertical;}
.f-row{display:flex;gap:10px;}
.f-col{flex:1 1 0;min-width:0;}
.f-acts{display:flex;gap:9px;margin-top:2px;}

/* ===== 拆解页 ===== */
.ask{
  position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:20;
  display:flex;gap:8px;align-items:center;
  padding:10px;margin:0 -2px 4px;
  background:rgba(10,10,15,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:14px;
}
.ask-in{
  flex:1;min-width:0;min-height:48px;padding:0 14px;
  background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:12px;
  font-size:16px;color:var(--text);
}
.ask-in:focus{outline:none;border-color:rgba(124,92,255,.55);}
.ask-in::placeholder{color:#4E4E5C;}
.ask-btn{
  flex:0 0 auto;width:48px;height:48px;border-radius:12px;
  background:linear-gradient(135deg,var(--violet),var(--cyan));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px -6px rgba(124,92,255,.8);
}
.ask-btn svg{width:20px;height:20px;stroke:#0A0A0F;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}

.chain{margin-top:6px;position:relative;padding-left:14px;}
.chain::before{
  content:'';position:absolute;left:3px;top:18px;bottom:18px;width:2px;border-radius:1px;
  background:linear-gradient(180deg,rgba(124,92,255,.5),rgba(34,211,238,.35));
}
.card{
  position:relative;margin-bottom:10px;padding:14px 14px 12px;
  background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  opacity:0;animation:cardIn .42s cubic-bezier(.2,1.2,.4,1) forwards;
  transition:border-color .18s,opacity .18s,transform .18s;
}
.card.sel{border-color:rgba(124,92,255,.75);background:rgba(124,92,255,.07);box-shadow:0 0 0 1px rgba(124,92,255,.3);}
.card.up{border-color:rgba(124,92,255,.45);}
.card.down{border-color:rgba(34,211,238,.45);}
.card.dim{opacity:.32;}
.card.pop{animation:pop 420ms cubic-bezier(.2,1.4,.4,1),flash 620ms ease-out;}
.c-top{display:block;}
.c-title{font-size:14.5px;font-weight:600;line-height:1.5;}
.c-dep{
  display:inline-block;margin-top:7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
  color:#A99BFF;background:rgba(124,92,255,.12);
  border:1px solid rgba(124,92,255,.24);border-radius:6px;padding:2px 7px;white-space:nowrap;
}
.c-sub{margin-top:6px;font-size:12px;line-height:1.65;color:var(--muted);}
.c-foot{margin-top:8px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;color:var(--dim);}
.c-foot .dot{width:3px;height:3px;border-radius:50%;background:var(--stroke-2);}
.c-state{font-size:10.5px;color:var(--ok);}

/* ===== 底部操作条 ===== */
.actbar{
  position:fixed;left:50%;opacity:0;pointer-events:none;
  transform:translateX(-50%) translateY(220%);
  bottom:calc(64px + env(safe-area-inset-bottom) + 10px);z-index:35;
  width:calc(100% - 28px);max-width:532px;
  display:flex;gap:8px;padding:8px;
  background:rgba(24,24,32,.92);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--stroke-2);border-radius:16px;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.9);
  transition:opacity .26s,transform .26s cubic-bezier(.2,1.1,.4,1);
}
.actbar.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
.actbar button{
  flex:1;min-height:46px;border-radius:11px;font-size:13.5px;font-weight:600;
  background:rgba(255,255,255,.06);color:var(--text);
}
.actbar button.primary{background:linear-gradient(120deg,var(--violet),var(--cyan));color:#0A0A0F;}
.actbar button.danger{color:#E0705E;}

/* ===== 目标页 ===== */
.goal{
  padding:16px 15px;margin-bottom:11px;
  background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
}
.g-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.g-head .g-name{flex:1;min-width:0;}
.g-mv{flex:0 0 auto;width:28px;height:28px;border:1px solid var(--stroke);border-radius:8px;color:var(--muted);font-size:13px;line-height:1;background:var(--glass);}
.g-mv:active{color:var(--cyan);border-color:rgba(34,211,238,.4);}
.g-mv[disabled]{opacity:.25;pointer-events:none;}
.g-name{font-size:16.5px;font-weight:700;line-height:1.45;}
.g-meta{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--dim);}
.g-meta .rw{font-family:var(--sans);font-size:12px;color:var(--cyan);}
.g-track{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:12px;overflow:hidden;}
.g-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .4s;}
.g-pct{margin-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--dim);}
.gain{
  margin-top:12px;padding:11px 13px;border-radius:12px;
  background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);
}
.gain-t{font-size:12px;font-weight:700;color:var(--ok);letter-spacing:.06em;}
.gain-s{margin-top:4px;font-size:12.5px;color:var(--muted);line-height:1.65;}
.x{
  flex:0 0 auto;width:38px;height:38px;margin:-6px -8px 0 0;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:17px;transition:all .18s;
}
.x.armed{color:#E0705E;background:rgba(224,112,94,.12);}

/* ===== 目标：阶段 ===== */
.stage{position:relative;margin-top:10px;border:1px solid var(--stroke);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.02);}
.stage.open{border-color:var(--stroke-2);background:rgba(255,255,255,.04);}
.st-head{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:12px 13px;min-height:52px;
}
.st-dot{
  flex:0 0 9px;height:9px;border-radius:50%;
  background:rgba(255,255,255,.18);transition:all .2s;
}
.stage.open .st-dot{background:linear-gradient(135deg,var(--violet),var(--cyan));box-shadow:0 0 9px rgba(124,92,255,.5);}
.stage.all .st-dot{background:var(--ok);box-shadow:0 0 9px rgba(52,211,153,.45);}
.st-body{flex:1;min-width:0;}
.st-name{font-size:14.5px;font-weight:600;line-height:1.45;color:var(--text);}
.stage.all .st-name{color:var(--muted);}
.st-n{margin-top:3px;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em;}
.st-arrow{
  flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--dim);
  transition:transform .22s,color .22s;
}
.stage.open .st-arrow{transform:rotate(90deg);color:var(--cyan);}
.st-bar{height:2px;background:rgba(255,255,255,.07);}
.st-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .45s;}
.stage.all .st-bar i{background:var(--ok);}
.st-inner{padding:4px 13px 10px;}
.pt{
  display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.045);
}
.pt:last-of-type{border-bottom:0;}
.pt-c{
  flex:0 0 22px;height:22px;border-radius:7px;border:1px solid var(--stroke-2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:transparent;transition:all .2s;
}
.pt-c.on{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.55);color:var(--ok);}
.pt-t{flex:1;min-width:0;text-align:left;font-size:13.5px;line-height:1.5;}
.pt-t.on{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(237,237,242,.25);}
.pt-put{
  flex:0 0 auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  color:var(--dim);border:1px solid var(--stroke);border-radius:6px;padding:3px 7px;
  transition:all .18s;
}
.pt-put.here{color:var(--cyan);border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.09);}
.pt-x{flex:0 0 auto;width:24px;height:24px;color:var(--dim);font-size:14px;line-height:1;}
.pt-x.armed{color:#E0705E;}
.st-add{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:10px 0;color:var(--dim);font-size:12.5px;
}
.st-add b{font-weight:400;color:var(--cyan);font-family:var(--mono);font-size:14px;}
.st-form{display:flex;gap:8px;padding:6px 0 4px;}
.st-in{
  flex:1;min-width:0;height:40px;padding:0 11px;
  background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:9px;
  font-size:16px;
}
.st-in::placeholder{color:#4E4E5C;font-size:13px;}
.st-in:focus{outline:none;border-color:rgba(124,92,255,.55);}
.st-ok{
  flex:0 0 auto;height:40px;padding:0 14px;border-radius:9px;
  background:linear-gradient(120deg,var(--violet),var(--cyan));color:#0A0A0F;
  font-size:13px;font-weight:600;
}
.st-ok:active{transform:scale(.97);}
.st-empty{padding:2px 0 8px;font-size:12px;color:var(--dim);line-height:1.7;}
.add-stage{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;min-height:44px;margin-top:11px;
  border:1px dashed rgba(255,255,255,.16);border-radius:11px;
  color:var(--muted);font-size:13px;transition:all .18s;
}
.add-stage:active{border-color:rgba(124,92,255,.5);color:var(--text);}
.st-kids{margin:8px 0 2px 13px;padding-left:11px;border-left:1px solid rgba(255,255,255,.10);}
.st-kids .stage{margin-top:8px;}
.st-kids .st-name{font-size:13px;}

/* ===== 成就 ===== */
.ledger{padding:16px 15px;border-radius:var(--r);background:var(--glass);border:1px solid var(--stroke);}
.lv-top{display:flex;align-items:baseline;justify-content:space-between;}
.lv-name{font-size:18px;font-weight:700;}

.grid28{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}

.badge{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.badge-ic{

}

.toast{

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 0;}

.journal-card{margin-bottom:10px;padding:13px 14px;border:1px solid var(--stroke);border-radius:13px;background:var(--glass);}
.journal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}

.journal-acts{display:flex;gap:14px;margin-top:7px;}

.plan-current{margin:10px 0;font-size:12px;color:var(--cyan);}
.adjust-preview{margin:10px 0 14px;padding:12px;border-radius:11px;background:rgba(255,255,255,.035);font-size:12.5px;line-height:1.75;color:var(--muted);}
.st-rename{position:absolute;right:13px;top:9px;min-height:32px;padding:0 4px;color:var(--dim);font-size:10px;z-index:2;}

@media (max-width:360px){.day-btn{flex-basis:45px}.pt-put{padding:3px 5px}.stat b{font-size:20px}}

}

<script>
(function(){
'use strict';

/* ===================== 基础 ===================== */
var LS='ruzhangben_v3', OLDS=['ruzhangben_v2','ruzhangben_v1'];
var CAP=3, WD=['日','一','二','三','四','五','六'];
var VIEW='today', selId=null, openForm=null, pendingDel=null, runGid=null,
    openStage=null, openAdd=null, viewDate=null, badgeRange='28',
    journalId=null, journalAll=false, modalId=null, cheerIndex=0;

function pad(n){ return n<10 ? '0'+n : ''+n; }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dOff(n){ var d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return iso(d); }
function addDays(ds,n){ var d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function localStamp(d){
  d=d||new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
var TODAY=dOff(0);
viewDate=TODAY;
function uid(p){ return p+Math.random().toString(36).slice(2,8); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }
function val(id){ var e=$(id); return e ? e.value.trim() : ''; }

/* ===================== 状态 ===================== */
function blank(){
  return { today:TODAY, points:0, checks:[], weekLog:{}, note:'', goals:[], tasks:[],
    lastRun:null, history:[], journal:[], startedAt:TODAY, goalSort:'manual' };
}
function fixState(s){
  if(!s || typeof s!=='object') return null;
  s.today = s.today || TODAY;
  s.points = s.points || 0;
  s.checks = Array.isArray(s.checks) ? s.checks : [];
  s.weekLog = s.weekLog || {};
  s.note = s.note || '';
  s.goals = Array.isArray(s.goals) ? s.goals : [];
  s.tasks = Array.isArray(s.tasks) ? s.tasks : [];
  s.lastRun = s.lastRun || null;
  s.history = Array.isArray(s.history) ? s.history : [];
  s.journal = Array.isArray(s.journal) ? s.journal : [];
  s.startedAt = s.startedAt || (s.checks.slice().sort()[0]) || TODAY;
  s.goalSort = s.goalSort==='due' ? 'due' : 'manual';
  s.goals.forEach(function(g){
    g.type = g.type || '';
    g.stages = Array.isArray(g.stages) ? g.stages : [];
  });
  s.tasks.forEach(function(t){
    t.deps = Array.isArray(t.deps) ? t.deps : [];
    t.from = t.from || 'manual';
    t.stage = t.stage || '';
    t.steps = Array.isArray(t.steps) ? t.steps : [];
    t.first = t.first || '先做最开头那一点';
    t.mins = parseInt(t.mins,10)>0 ? parseInt(t.mins,10) : 30;
    if(!t.planDate){
      if(t.slot==='today') t.planDate=s.today;
      else if(t.done) t.planDate=s.today;
      else t.planDate='';
    }
    if(t.done && !t.doneDate) t.doneDate=t.planDate||s.today;
    if(t.doneDate){
      var old=s.history.filter(function(h){ return h.type==='done'&&h.taskId===t.id; })[0];
      if(!old) s.history.push({id:uid('h'),type:'done',taskId:t.id,title:t.title||'',date:t.doneDate,mins:t.mins});
    }
  });
  // 旧数据：目标下有任务但还没分阶段，自动归进「阶段 1」
  s.goals.forEach(function(g){
    var loose = s.tasks.filter(function(t){ return t.g===g.id && !t.stage; });
    if(loose.length && !g.stages.length){
      var sid = uid('s');
      g.stages.push({ id:sid, name:'阶段 1' });
      loose.forEach(function(t){ t.stage = sid; });
    }
  });
  return s;
}
function load(){
  var raw=null, key=LS;
  try{ raw=localStorage.getItem(LS); }catch(e){}
  if(!raw){
    for(var i=0;i<OLDS.length;i++){
      try{ raw=localStorage.getItem(OLDS[i]); }catch(e){}
      if(raw){ key=OLDS[i]; break; }
    }
  }
  if(!raw) return blank();
  var s;
  try{ s=JSON.parse(raw); }catch(e){ return blank(); }
  s=fixState(s);
  if(!s) return blank();
  if(key!==LS){ try{ localStorage.setItem(LS, JSON.stringify(s)); }catch(e){} }
  return s;
}
var state=load();
function save(){
  state._t=new Date().toISOString();
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  schedulePush();
}

/* ===================== 云同步（Supabase REST） ===================== */
var CK='ruzhangben_cloud';
/* 内置云配置：换设备/清缓存后自动连上，无需手动填 */
var BUILTIN={url:'https://sdbtjreomutzdvjaskjz.supabase.co',key:'sb_publishable_EgY7O_GiwBils6DyHHF7bw_JgPfTNr7',table:'ledger'};
var cloud=null;
try{ var rc=localStorage.getItem(CK); cloud=rc?JSON.parse(rc):null; }catch(e){ cloud=null; }
if(!cloud||!cloud.url||!cloud.key){ cloud=BUILTIN.url?{url:BUILTIN.url,key:BUILTIN.key,table:BUILTIN.table}:null; }
var pushTimer=null;

function setSyn(m){
  var d=$('synDot'); if(!d) return;
  d.className='syn'+(m==='ok'?' ok':(m==='busy'?' busy':(m==='err'?' err':'')));
}
function keepCfg(c){
  cloud=c;
  try{ if(c) localStorage.setItem(CK,JSON.stringify(c)); else localStorage.removeItem(CK); }catch(e){}
}
function sbUrl(){ return (cloud.url||'').replace(/\/+$/,'')+'/rest/v1/'+(cloud.table||'ledger'); }
function sbHead(extra){
  var h={'apikey':cloud.key,'Authorization':'Bearer '+cloud.key};
  if(extra) for(var k in extra) h[k]=extra[k];
  return h;
}
function pushCloud(){
  if(!cloud) return Promise.resolve(false);
  setSyn('busy');
  state._t=new Date().toISOString();
  try{ localStorage.setItem(LS,JSON.stringify(state)); }catch(e){}
  return fetch(sbUrl()+'?on_conflict=id',{
    method:'POST',
    headers:sbHead({'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify([{id:'main',data:state,updated_at:state._t}])
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    setSyn('ok'); return true;
  }).catch(function(e){ setSyn('err'); console.warn('云上传失败',e); return false; });
}
function pullCloud(){
  if(!cloud) return Promise.resolve(null);
  setSyn('busy');

function applyRemote(d){
  if(!d || !Array.isArray(d.tasks) || !Array.isArray(d.goals)) return false;

function bootCloud(){

    if(lt && lt>rt){ pushCloud(); return; }

function byId(id){ return state.tasks.filter(function(t){ return t.id===id; })[0]; }
function goalById(id){ return state.goals.filter(function(g){ return g.id===id; })[0]; }
function goalName(id){ var g=goalById(id); return g ? g.name : '未归类'; }
function dayTasks(ds){ return state.tasks.filter(function(t){ return t.planDate===ds; }); }
function todayTasks(){ return dayTasks(TODAY); }
function poolTasks(){ return state.tasks.filter(function(t){ return !t.planDate; }); }
function doneCount(ds){ return dayTasks(ds||viewDate).filter(function(t){ return t.done; }).length; }
function spentMins(ds){ return dayTasks(ds||viewDate).reduce(function(a,t){ return a+(t.done?t.mins:0); },0); }
function totalMins(ds){ return dayTasks(ds||viewDate).reduce(function(a,t){ return a+t.mins; },0); }
function fmtMins(m){
  if(m<60) return m+' 分钟';
  var h=Math.floor(m/60), r=m%60;
  return r ? h+' 小时 '+r+' 分' : h+' 小时';
}
function isFullDay(){ return doneCount(TODAY)>=CAP; }
function stepDone(t){ return t.steps.filter(function(s){ return s.done; }).length; }
function dayLabel(ds){
  if(ds===TODAY) return '今天';
  if(ds===dOff(1)) return '明天';
  if(ds===dOff(2)) return '后天';
  var d=new Date(ds+'T12:00:00');
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function syncDayStats(ds){
  ds=ds||TODAY;
  var ts=dayTasks(ds), done=ts.filter(function(t){ return t.done; }).length;
  state.weekLog[ds]=done;
  if(done>=CAP){ if(state.checks.indexOf(ds)<0) state.checks.push(ds); }
  else state.checks=state.checks.filter(function(d){ return d!==ds; });
  state.weekLog[ds]=done;
}
function historyDone(t,ds){
  var h=state.history.filter(function(x){ return x.type==='done'&&x.taskId===t.id; })[0];
  if(!h) state.history.push({id:uid('h'),type:'done',taskId:t.id,title:t.title,date:ds,mins:t.mins});
}
function historyUndone(t){
  state.history=state.history.filter(function(h){ return !(h.type==='done'&&h.taskId===t.id); });
}
function longestStreak(){
  var set={}; state.checks.forEach(function(d){ set[d]=1; });
  var best=0, run=0, d=addDays(TODAY,-400);
  for(var i=0;i<=400;i++){
    if(set[d]){ run++; best=Math.max(best,run); } else run=0;
    d=addDays(d,1);
  }
  return best;
}
function dayCount(ds){ return state.history.filter(function(h){ return h.type==='done'&&h.date===ds; }).length; }
function ancestors(id,set){
  set=set||{};
  var t=byId(id); if(!t) return set;
  t.deps.forEach(function(d){ if(!set[d]){ set[d]=1; ancestors(d,set); } });
  return set;
}
function descendants(id,set){
  set=set||{};
  state.tasks.forEach(function(t){
    if(t.deps.indexOf(id)>=0 && !set[t.id]){ set[t.id]=1; descendants(t.id,set); }
  });
  return set;
}
function streak(){
  var set={};
  state.checks.forEach(function(d){ set[d]=1; });
  var n=0, i=set[TODAY]?0:1, gap=false;
  while(i<=400){
    if(set[dOff(-i)]){ n++; i++; continue; }
    if(!gap && set[dOff(-(i+1))]){ gap=true; i++; continue; }
    break;
  }
  return n;
}
function addCheck(){ if(state.checks.indexOf(TODAY)<0) state.checks.push(TODAY); }
function dropCheckIfEmpty(){ syncDayStats(TODAY); }
function levelInfo(){
  var p=state.points;
  if(p<50) return {lv:1,name:'起步',next:50,pct:p/50*100};
  if(p<150) return {lv:2,name:'稳住',next:150,pct:(p-50)/100*100};
  if(p<400) return {lv:3,name:'上手',next:400,pct:(p-150)/250*100};
  if(p<900) return {lv:4,name:'老手',next:900,pct:(p-400)/500*100};
  return {lv:5,name:'长期主义',next:900,pct:100};
}
function daysLeft(due){
  if(!due) return null;
  var t=new Date(due+'T00:00:00'), n=new Date(TODAY+'T00:00:00');
  return Math.round((t-n)/86400000);
}
function dueText(due){
  var d=daysLeft(due);
  if(d===null) return '';
  if(d<0) return '已过期 '+(-d)+' 天';
  if(d===0) return '就是今天';
  return '还有 '+d+' 天';
}

function renderDecompose(){
  var run=state.lastRun;
  var cards='', up={}, down={};
  if(selId){ up=ancestors(selId); down=descendants(selId); }

  if(run && run.ids){
    cards=run.ids.map(function(id,i){
      var t=byId(id); if(!t) return '';
      var cls='card';
      if(selId){
        if(id===selId) cls+=' sel';
        else if(up[id]) cls+=' up';
        else if(down[id]) cls+=' down';
        else cls+=' dim';
      }
      var dep=t.deps.map(function(d){ var x=byId(d); return x?x.title:''; })
        .filter(Boolean).join('、');
      return '<div class="'+cls+'" data-act="sel" data-id="'+t.id+'" style="animation-delay:'+(i*80)+'ms">' +
        '<div class="c-title">'+esc(t.title)+'</div>' +
        (dep?'<div class="c-dep">← 依赖 '+esc(dep.length>10?dep.slice(0,10)+'…':dep)+'</div>':'') +
        '<div class="c-sub">'+esc(t.first)+'</div>' +
        '<div class="c-foot"><span>'+t.mins+' 分</span><span class="dot"></span>' +
          '<span>'+(t.done?'已入账':'待做')+'</span>' +
          (t.slot==='today'?'<span class="dot"></span><span class="c-state">在今天</span>':'') +
        '</div>' +
      '</div>';
    }).join('');
  }

  var dag='';
  if(run && run.ids && window.innerWidth>=768 && run.ids.length>=4) dag=dagSvg(run.ids);

  return '<div class="vhead">' +
      '<div class="eyebrow">LOCAL DECOMPOSE</div>' +
      '<h1>拆解</h1>' +
      '<p class="vlead">写一个目标，我按模板拆成几步。全部在本地跑，不联网。</p>' +
    '</div>' +
    '<div class="ask">' +
      '<input class="ask-in" id="goalText" placeholder="输入一个目标，我来拆解" autocomplete="off" enterkeyhint="go">' +
      '<button class="ask-btn" data-act="decompose" aria-label="开始拆解">' +
        '<svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>' +
    '</div>' +
    (run && run.ids
      ? '<div class="seclabel"><span>拆出来了 · '+run.ids.length+' 步</span>' +
          '<em data-act="undo-run" style="color:#E0705E;cursor:pointer">整组撤销</em></div>' +
        dag+'<div class="chain">'+cards+'</div>'
      : emptyBox('','还没有拆过','输入一个目标，我按考研/求职/竞赛/习惯的模板，拆成 4 到 5 步。',''));
}

function dagSvg(ids){
  var nodes=ids.map(byId).filter(Boolean);
  var layer={};
  function depth(t){
    if(layer[t.id]!=null) return layer[t.id];
    var d=0;
    t.deps.forEach(function(x){ var p=byId(x); if(p) d=Math.max(d, depth(p)+1); });
    layer[t.id]=d; return d;
  }
  nodes.forEach(depth);
  var buckets={}, maxL=0;
  nodes.forEach(function(t){
    var L=layer[t.id];
    buckets[L]=buckets[L]||[]; buckets[L].push(t);
    maxL=Math.max(maxL,L);
  });
  var NW=168, NH=62, GX=186, GY=104;
  var W=(maxL+1)*GX+40, H=0;
  Object.keys(buckets).forEach(function(k){ H=Math.max(H,buckets[k].length); });
  H=H*GY+40;
  var pos={};
  Object.keys(buckets).forEach(function(k){
    buckets[k].forEach(function(t,i){
      pos[t.id]={x:40+k*GX, y:20+i*GY};
    });
  });
  var edges='';
  nodes.forEach(function(t){
    t.deps.forEach(function(d){
      var a=pos[d], b=pos[t.id]; if(!a||!b) return;
      var x1=a.x+NW, y1=a.y+NH/2, x2=b.x, y2=b.y+NH/2;
      var mx=(x1+x2)/2;
      edges+='<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" '+
        'fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1.2"/>';
    });
  });
  var boxes=nodes.map(function(t){
    var p=pos[t.id];
    var isSel = selId && (t.id===selId);
    var stroke = isSel ? 'rgba(124,92,255,.9)' : 'rgba(255,255,255,.14)';
    return '<g data-act="sel" data-id="'+t.id+'" style="cursor:pointer">' +
      '<rect x="'+p.x+'" y="'+p.y+'" width="'+NW+'" height="'+NH+'" rx="14" '+
        'fill="rgba(255,255,255,'+(isSel?'.10':'.04')+'" stroke="'+stroke+'"/>' +
      '<text x="'+(p.x+14)+'" y="'+(p.y+26)+'" fill="#EDEDF2" font-size="12.5" '+
        'font-family="-apple-system,PingFang SC,sans-serif">'+esc(t.title.length>9?t.title.slice(0,9)+'…':t.title)+'</text>' +
      '<text x="'+(p.x+14)+'" y="'+(p.y+46)+'" fill="#8A8A99" font-size="10" '+
        'font-family="ui-monospace,Menlo,monospace">'+t.mins+' 分 · '+(t.done?'已入账':'待做')+'</text>' +
    '</g>';
  }).join('');
  return '<div class="dag"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+edges+boxes+'</svg></div>';
}

/* ---------- 目标：阶段制 ---------- */
function stageTasks(gid,sid){
  return state.tasks.filter(function(t){ return t.g===gid && t.stage===sid; });
}
function gStats(g){
  var ts=state.tasks.filter(function(t){ return t.g===g.id; });
  return { n:ts.length, d:ts.filter(function(t){ return t.done; }).length };
}
/* ----- 阶段树：parent 为空即顶层，旧数据无 parent 自动归顶层 ----- */
function childStages(g,pid){
  var p=pid||null;
  return g.stages.filter(function(s){ return (s.parent||null)===p; });
}
function subtreeIds(g,sid){
  var out=[sid], seen={}, queue=[sid];
  seen[sid]=1;
  while(queue.length){
    var cur=queue.shift();
    g.stages.forEach(function(s){
      if((s.parent||null)===cur && !seen[s.id]){ seen[s.id]=1; out.push(s.id); queue.push(s.id); }
    });
  }
  return out;
}
function subtreeTasks(g,sid){
  var ids=subtreeIds(g,sid), map={};
  ids.forEach(function(i){ map[i]=1; });
  return state.tasks.filter(function(t){ return t.g===g.id && map[t.stage]; });
}
function stageTree(g,pid,depth){
  if(depth>12) return '';
  return childStages(g,pid).map(function(st){ return stageBlock(g,st,depth); }).join('');
}
function ptRow(t){
  var when=t.done?('已完成 · '+(t.doneDate||'')):(t.planDate?dayLabel(t.planDate)+' · '+t.planDate:'未安排');
  return '<div class="pt">' +
    '<button class="pt-c'+(t.done?' on':'')+'" data-act="toggle-pt" data-id="'+t.id+'" aria-label="'+(t.done?'撤销':'勾掉')+'">✓</button>' +
    '<button class="pt-t'+(t.done?' on':'')+'" data-act="toggle-pt" data-id="'+t.id+'">'+esc(t.title)+'</button>' +
    '<button class="pt-put'+(t.planDate?' here':'')+'" data-act="open-plan" data-id="'+t.id+'">安排</button>' +
    '<button class="pt-put" data-act="edit-pt" data-id="'+t.id+'">编辑</button>' +
    '<button class="pt-x'+(pendingDel==='pt:'+t.id?' armed':'')+'" data-act="del-pt" data-id="'+t.id+'" aria-label="删掉">×</button>' +
    '<div class="pt-date">'+esc(when)+'</div></div>';
}
function stageBlock(g,st,depth){
  depth=depth||0;
  var ts=subtreeTasks(g,st.id);
  var d=ts.filter(function(t){ return t.done; }).length;
  var n=ts.length, pct=n?Math.round(d/n*100):0;
  var direct=stageTasks(g.id,st.id);
  var isOpen=openStage===st.id, allDone=n>0&&d===n;
  var cls='stage'+(isOpen?' open':'')+(allDone?' all':'');
  var inner='';
  if(isOpen){
    var rows=direct.length ? direct.map(ptRow).join('')
      : '<div class="st-empty">这个阶段还是空的。加一件小事，或再分一个子阶段。</div>';
    var add=openAdd==='pt:'+st.id
      ? '<div class="st-form"><input class="st-in" id="ptName" placeholder="例如：过完第三章" enterkeyhint="done">' +
          '<button class="st-ok" data-act="add-pt" data-sid="'+st.id+'" data-gid="'+g.id+'">加</button></div>'
      : '<button class="st-add" data-act="open-pt" data-sid="'+st.id+'" data-gid="'+g.id+'"><b>＋</b>加一件</button>';
    var sub=openAdd==='substage:'+st.id
      ? '<div class="st-form"><input class="st-in" id="subName" placeholder="子阶段名，例如：第一轮 · 过课本" enterkeyhint="done">' +
          '<button class="st-ok" data-act="add-sub-stage" data-sid="'+st.id+'" data-gid="'+g.id+'">加</button></div>'
      : '<button class="st-add" data-act="open-sub-form" data-sid="'+st.id+'" data-gid="'+g.id+'"><b>＋</b>分子阶段</button>';
    inner='<div class="st-inner">'+rows+add+sub+
      '<button class="st-add" style="color:#8C6A63" data-act="del-stage" data-sid="'+st.id+'" data-gid="'+g.id+'">'+
        (pendingDel==='s:'+st.id?'再点一次，这个分支和里面的东西一起删':'删掉这个阶段')+'</button>' +
    '</div>';
  }
  var kids=childStages(g,st.id);
  var kidsHtml=kids.length?'<div class="st-kids">'+stageTree(g,st.id,depth+1)+'</div>':'';
  var stn=n?(d+' / '+n+' 件'):'';
  if(kids.length) stn+=(stn?' · ':'')+kids.length+' 个子阶段';
  if(!stn) stn=isOpen?'还没加东西':'点开加几件';
  return '<div class="'+cls+'">' +
    (openAdd==='rename:'+st.id
      ? '<div class="st-form" style="padding:10px 13px 0"><input class="st-in" id="renameStage" value="'+esc(st.name)+'" enterkeyhint="done" data-sid="'+st.id+'" data-gid="'+g.id+'">'+
        '<button class="st-ok" data-act="save-stage-name" data-sid="'+st.id+'" data-gid="'+g.id+'">存</button></div>'+
        '<button class="sheet-x" style="min-height:32px;margin:0" data-act="cancel-rename">取消改名</button>'
      : '<button class="st-head" data-act="open-stage" data-id="'+st.id+'">' +
      '<div class="st-dot"></div><div class="st-body"><div class="st-name">'+esc(st.name)+'</div>' +
      '<div class="st-n">'+stn+'</div></div></button>'+
      '<button class="st-rename" data-act="rename-stage" data-sid="'+st.id+'" data-gid="'+g.id+'">改名</button>') +
    '<div class="st-bar"><i style="width:'+pct+'%"></i></div>' + inner + kidsHtml + '</div>';
}

function renderGoals(){
  var ordered=state.goals.slice();
  if(state.goalSort==='due'){
    ordered.sort(function(a,b){
      var sa=gStats(a), sb=gStats(b);
      var ca=(sa.n>0&&sa.n===sa.d)?1:0, cb=(sb.n>0&&sb.n===sb.d)?1:0;
      if(ca!==cb) return ca-cb;
      var da=a.due||'9999-12-31', db=b.due||'9999-12-31';
      return da<db?-1:(da>db?1:0);
    });
  }
  var cards=ordered.map(function(g,gi){
    var tot=gStats(g);
    var complete=tot.n>0 && tot.d===tot.n;
    var dl=daysLeft(g.due);

    var meta='';
    if(g.due) meta+='<span>截止 '+esc(g.due)+'</span><span style="color:'+
      (complete?'var(--ok)':(dl!==null&&dl<=30?'#E0705E':'var(--text)'))+'">'+
      (complete?'已达成':dueText(g.due))+'</span>';
    if(g.reward) meta+='<span class="rw">奖励 · '+esc(g.reward)+'</span>';

    var stages=g.stages.length
      ? stageTree(g,null,0)
      : '<div class="st-empty" style="padding:10px 2px 0">还没分阶段。分成两三个阶段，每个阶段放几件做得完的事，需要的话再往下分子阶段。</div>';

    var addStage = openAdd==='stage:'+g.id
      ? '<div class="st-form" style="margin-top:11px"><input class="st-in" id="stName" placeholder="例如：第一阶段 · 打基础" enterkeyhint="done">' +
          '<button class="st-ok" data-act="add-stage" data-gid="'+g.id+'">加</button></div>'
      : '<button class="add-stage" data-act="open-stage-form" data-gid="'+g.id+'"><b>＋</b>加一个阶段</button>';

    return '<div class="goal">' +
      (openAdd==='gname:'+g.id
        ? '<div class="st-form" style="padding:0 0 4px"><input class="st-in" id="renameGoal" value="'+esc(g.name)+'" enterkeyhint="done" data-id="'+g.id+'">'+
          '<button class="st-ok" data-act="save-goal-name" data-id="'+g.id+'">存</button></div>'+
          '<button class="sheet-x" style="min-height:30px;margin:0 0 6px" data-act="cancel-goal-rename">取消改名</button>'
        : '<div class="g-head"><h3 class="g-name">'+esc(g.name)+'</h3>' +
          (state.goalSort!=='due' && state.goals.length>1
            ? '<button class="g-mv" data-act="goal-up" data-id="'+g.id+'"'+(gi===0?' disabled':'')+' aria-label="上移">↑</button>'+
              '<button class="g-mv" data-act="goal-down" data-id="'+g.id+'"'+(gi===ordered.length-1?' disabled':'')+' aria-label="下移">↓</button>'
            : '') +
          '<button class="st-rename" style="position:static" data-act="rename-goal" data-id="'+g.id+'">改名</button>' +
          '<button class="x'+(pendingDel==='g:'+g.id?' armed':'')+'" data-act="del-goal" data-id="'+g.id+'" aria-label="删除目标">×</button></div>') +
      (meta?'<div class="g-meta">'+meta+'</div>':'') +
      '<div class="g-track"><div class="g-fill" style="width:'+(tot.n?Math.round(tot.d/tot.n*100):0)+'%"></div></div>' +
      '<div class="g-pct">'+tot.d+' / '+tot.n+' 件'+
        (g.stages.length?' · '+g.stages.length+' 个阶段':'')+(g.type?' · '+esc(g.type):'')+'</div>' +
      stages + addStage +
      (complete?'<div class="gain"><div class="gain-t">已达成</div><div class="gain-s">'+
        (g.reward?'该兑现了：'+esc(g.reward):'这个目标走完了。空一天，再开下一个。')+'</div></div>':'') +
    '</div>';
  }).join('');

  return '<div class="vhead"><div class="eyebrow">GOALS</div><h1>目标</h1>' +
      '<p class="vlead">一个目标分几个阶段，每个阶段放几件做得完的事。勾一件，进度就往前走一格。</p></div>' +
    (openForm==='goal'?goalForm():'<button class="btn ghost" style="width:100%;margin-bottom:12px" data-act="open-goal-form">＋ 新建目标</button>') +
    (state.goals.length>1
      ? '<div class="range-tabs" style="margin-bottom:4px"><button class="'+(state.goalSort!=='due'?'on':'')+'" data-act="goal-sort" data-mode="manual">手动排序</button>'+
        '<button class="'+(state.goalSort==='due'?'on':'')+'" data-act="goal-sort" data-mode="due">按截止时间</button></div>'+
        '<p class="hint" style="margin:4px 2px 10px">'+(state.goalSort==='due'?'按截止时间从近到远自动排，已达成的沉底，没填时间的排最后。':'用 ↑↓ 调整顺序，最上面的放最前面。')+'</p>'
      : '') +
    (state.goals.length?cards:(openForm==='goal'?'':emptyBox('','还没有目标','先写一个你想走到的地方，再把它分成几个阶段。一次别超过三个。',''))) +
    '<p class="hint">没安排日期的任务，勾了只推进度。安排到日程后完成才计分；延期不扣分。</p>';

    '<div class="seclabel"><span>'+rangeName+'</span><em>'+(range===28?'每格一天':'数字是完成件数')+'</em></div>'+

    '<div class="seclabel"><span>徽章</span><em>'+badges.filter(function(b){ return b.ok; }).length+' / 4</em></div>'+bh+
    '<p class="hint">从 '+state.startedAt+' 开始记录。旧版未保存日期的历史不会被虚构补回。</p>';
}

/* ---------- 复盘 ---------- */
function openJournal(id){
  var j=id?state.journal.filter(function(x){ return x.id===id; })[0]:null;
  journalId=j?j.id:null;
  openModal('<div class="sheet-t">'+(j?'回看并修改心得':'记一笔心得')+'</div>'+
    '<div class="sheet-s">不评判自己，只记录发生了什么，以及下一次想怎么调整。</div>'+
    '<label class="f-label" for="jDate">日期</label><input class="f-in" id="jDate" type="date" value="'+(j?j.date:TODAY)+'">'+
    '<label class="f-label">今天的感觉</label><div class="mood-row" id="moodRow">'+
      ['轻松','一般','有点累'].map(function(m){ return '<button class="'+(((j?j.mood:'一般')===m)?'on':'')+'" data-act="pick-mood" data-mood="'+m+'">'+m+'</button>'; }).join('')+'</div>'+
    '<label class="f-label" for="jGood">做得好的一点</label><textarea class="f-in" id="jGood" placeholder="哪怕只是开始了五分钟">'+esc(j?j.good:'')+'</textarea>'+
    '<label class="f-label" for="jHard">卡在哪里</label><textarea class="f-in" id="jHard" placeholder="写事实，不给自己下结论">'+esc(j?j.hard:'')+'</textarea>'+
    '<label class="f-label" for="jNext">下一次怎么调</label><textarea class="f-in" id="jNext" placeholder="例如：先缩小成十五分钟">'+esc(j?j.next:'')+'</textarea>'+
    '<button class="btn" style="width:100%" data-act="save-journal">保存心得</button>');
}
function saveJournal(){
  var good=val('jGood'), hard=val('jHard'), next=val('jNext');
  if(!good&&!hard&&!next){ toast('写一句也好'); return; }
  var moodEl=document.querySelector('#moodRow button.on');
  var j={id:journalId||uid('j'),date:val('jDate')||TODAY,mood:moodEl?moodEl.getAttribute('data-mood'):'一般',
    good:good,hard:hard,next:next,updated:localStamp()};
  if(journalId) state.journal=state.journal.map(function(x){ return x.id===journalId?j:x; });
  else state.journal.push(j);
  journalId=null; save(); closeModal(); render(); toast('心得已保存，以后可以回看');
}
function journalCard(j){
  var text=[j.good?'做得好：'+j.good:'',j.hard?'卡住了：'+j.hard:'',j.next?'下次调整：'+j.next:''].filter(Boolean).join('\n');
  return '<div class="journal-card"><div class="journal-top"><span class="journal-date">'+esc(j.date)+'</span><span class="journal-mood">'+esc(j.mood||'一般')+'</span></div>'+
    '<p class="journal-text">'+esc(text)+'</p><div class="journal-acts"><button data-act="edit-journal" data-id="'+j.id+'">回看 / 修改</button>'+
    '<button class="danger" data-act="del-journal" data-id="'+j.id+'">'+(pendingDel==='j:'+j.id?'再点一次删除':'删除')+'</button></div></div>';
}
function renderReview(){
  var days=[], total=0;
  for(var i=-6;i<=0;i++){
    var d=dOff(i), c=dayCount(d);
    total+=c; days.push({d:new Date(d+'T12:00:00'),c:c});
  }
  var target=CAP*7, rate=total/target;
  var max=Math.max(1,Math.max.apply(null,days.map(function(x){ return x.c; })));
  var bars=days.map(function(x){
    var h=Math.round(x.c/max*100);
    return '<i class="'+(x.c?'on':'')+(iso(x.d)===TODAY?' today':'')+'" style="height:'+Math.max(h,3)+'%"></i>';
  }).join('');
  var axis=days.map(function(x){ return '<span>'+WD[x.d.getDay()]+'</span>'; }).join('');
  var comment;
  if(total===0) comment='这周还没有记录。可以从一件十分钟的小事开始，也可以先休息。';
  else if(rate<0.5) comment='这周做得少一些。只调整计划，不给自己下结论。';
  else if(rate<0.85) comment='节奏在变稳。保留最有效的一个做法就够了。';
  else comment='这周完成了不少。接下来不是加量，是让节奏变得不费力。';
  var js=state.journal.slice().sort(function(a,b){ return (b.date+b.updated).localeCompare(a.date+a.updated); });
  var visible=journalAll?js:js.slice(0,3);
  return '<div class="vhead"><div class="eyebrow">REVIEW</div><h1>复盘</h1>'+
    '<p class="vlead">看数据，也听听自己的感受。然后只改一件事。</p></div>'+
    '<div class="ledger" style="display:flex;align-items:flex-end;gap:12px">'+
    '<div style="font-family:var(--mono);font-size:40px;line-height:1;font-weight:500">'+total+'</div>'+
    '<div style="padding-bottom:3px;font-size:12px;color:var(--muted)">/ '+target+' 件<br>本周参考值 '+Math.round(rate*100)+'%</div></div>'+
    '<div class="seclabel"><span>每天完成</span><em>不要求每天满额</em></div><div class="bars">'+bars+'</div><div class="axis">'+axis+'</div>'+
    '<p class="hint">'+comment+'</p><div class="seclabel"><span>心得</span><em>'+state.journal.length+' 条记录</em></div>'+
    '<button class="btn ghost" style="width:100%" data-act="new-journal">＋ 记一笔心得</button>'+
    '<div style="margin-top:12px">'+(visible.length?visible.map(journalCard).join(''):'<div class="soft-note">写下做得好的一点、卡在哪里、下次怎么调。以后随时能回来翻。</div>')+'</div>'+
    (js.length>3?'<button class="sheet-x" data-act="toggle-journal-all">'+(journalAll?'收起':'查看全部 '+js.length+' 条')+'</button>':'')+
    '<div class="seclabel"><span>下周只改一件事</span></div>'+
    '<div class="note-box"><textarea id="noteInput" placeholder="例如：把最难的那件放到上午第一节前">'+esc(state.note)+'</textarea>'+
    '<div style="margin-top:10px"><button class="btn sm" data-act="save-note">存进下周</button></div></div>'+
    '<div class="io"><button class="btn ghost sm" data-act="export">导出备份</button><button class="btn ghost sm" data-act="import">导入备份</button></div>'+
    '<input type="file" id="fileIn" accept="application/json" style="display:none">';
}

/* ===================== 交互 ===================== */
function toast(msg){
  var host=$('toastHost');
  host.innerHTML='<div class="toast on">'+esc(msg)+'</div>';
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){
    var t=host.firstChild; if(t) t.classList.remove('on');
  },1900);
}

function updateActbar(){
  var bar=$('actbar');
  var t=selId?byId(selId):null;
  if(!t){ bar.classList.remove('show'); return; }
  bar.classList.add('show');
  var b=bar.querySelectorAll('button');
  b[0].textContent = t.done ? '撤销' : '完成';
  b[1].textContent = t.slot==='today' ? '移回池子' : '放到今天';
}

function go(v){ VIEW=v; selId=null; render(); window.scrollTo(0,0); }

function toggleTask(id){
  var t=byId(id); if(!t) return;
  var wasFull=isFullDay();
  if(t.done){
    t.done=false; t.doneDate=''; state.points=Math.max(0,state.points-15);
    historyUndone(t); syncDayStats(TODAY);
    if(wasFull&&!isFullDay()) state.points=Math.max(0,state.points-5);
    toast('已撤销，完成记录也同步调整');
  } else {
    t.done=true; t.doneDate=TODAY; t.planDate=TODAY; t.slot='today';
    state.points+=15; historyDone(t,TODAY); syncDayStats(TODAY);
    toast('入账 +15 · 完成这一件就很好');
    if(!wasFull&&isFullDay()){ state.points+=5; setTimeout(function(){ toast('三件完成 +5 · 今天这部分已经够了'); },700); }
  }
  save(); render();
  var el=document.querySelector('.task[data-id="'+id+'"]');
  if(el){ el.classList.add('pop'); setTimeout(function(){ el.classList.remove('pop'); },700); }
}

function decompose(){
  var text=val('goalText');
  if(!text){ toast('先写一句目标'); return; }
  if(text.length>40){ toast('目标太长了，一句话就够'); return; }
  var tpl=pickTemplate(text);
  var g=state.goals.filter(function(x){ return x.name===text; })[0];
  if(!g){ g={id:uid('g'),name:text,due:'',reward:'',note:'',type:tpl.type}; state.goals.push(g); }
  var ids=[];
  tpl.steps.forEach(function(s){
    var t={id:uid('t'),g:g.id,title:s.t,mins:s.mins,first:s.first,slot:'pool',
           done:false,steps:[],deps:[],from:'ai'};
    state.tasks.push(t); ids.push(t.id);
  });
  tpl.steps.forEach(function(s,i){
    (s.deps||[]).forEach(function(di){ if(ids[di]) byId(ids[i]).deps.push(ids[di]); });
  });
  state.lastRun={text:text,goalId:g.id,ids:ids};
  selId=null; runGid=g.id; save(); render();
  toast('拆成 '+ids.length+' 步');
}

function undoRun(){
  var run=state.lastRun; if(!run||!run.ids) return;
  state.tasks=state.tasks.filter(function(t){ return run.ids.indexOf(t.id)<0; });
  var g=goalById(run.goalId);
  if(g && !state.tasks.some(function(t){ return t.g===g.id; })){
    state.goals=state.goals.filter(function(x){ return x.id!==g.id; });
  }
  state.lastRun=null; selId=null; save(); render(); toast('整组已撤销');
}

function exportData(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='入账本备份-'+TODAY+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast('已导出');
}

function importData(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var s=JSON.parse(r.result);
      if(!s || !Array.isArray(s.tasks)) throw new Error('bad');
      state=fixState(s); save(); VIEW='today'; selId=null; viewDate=TODAY; render(); toast('已导入，心得和历史也在');
    }catch(e){ toast('这个文件读不出来'); }
  };
  r.readAsText(file);
}

/* ===================== 事件 ===================== */
document.addEventListener('click',function(e){
  var el=e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el){
    if(pendingDel){ pendingDel=null; render(); return; }
    if(VIEW==='decompose' && selId){ selId=null; render(); }
    return;
  }
  var act=el.getAttribute('data-act');
  var id=el.getAttribute('data-id');

  switch(act){
    case 'goto': go(el.getAttribute('data-view')); break;
    case 'view-date': viewDate=el.getAttribute('data-date'); pendingDel=null; render(); break;
    case 'next-cheer': cheerIndex++; render(); break;
    case 'badge-range': badgeRange=el.getAttribute('data-range'); render(); break;
    case 'edit-pt': openEdit(id); break;
    case 'save-edit':
      var et=byId(id); if(!et) return;
      var etitle=val('editTitle'), emins=parseInt(val('editMins'),10), edate=val('editDate');
      if(!etitle){ toast('任务名不能为空'); return; }
      if(!(emins>=5&&emins<=600)){ toast('预计时间填 5 到 600 分钟'); return; }
      var eold=et.planDate;
      et.title=etitle; et.mins=emins; et.first=val('editFirst')||'先做最小的一步';
      et.planDate=edate; et.slot=edate===TODAY?'today':'pool';
      if(eold!==edate){
        state.history.push({id:uid('h'),type:'adjust',taskId:id,title:etitle,date:localStamp(),from:eold,to:edate});
        syncDayStats(eold); syncDayStats(edate);
      }
      state.history.forEach(function(h){ if(h.taskId===id) h.title=etitle; });
      save(); closeModal(); render(); toast('已保存修改，进度和积分没变');
      break;
    case 'goal-sort':
      state.goalSort=el.getAttribute('data-mode')==='due'?'due':'manual';
      save(); render();
      toast(state.goalSort==='due'?'按截止时间自动排序':'手动排序，用 ↑↓ 调整');
      break;
    case 'goal-up':
    case 'goal-down':
      var gi=state.goals.findIndex(function(x){ return x.id===id; });
      var gj=act==='goal-up'?gi-1:gi+1;
      if(gi>=0&&gj>=0&&gj<state.goals.length){
        var tmp=state.goals[gi]; state.goals[gi]=state.goals[gj]; state.goals[gj]=tmp;
        save(); render();
      }
      break;
    case 'rename-goal':
      openAdd='gname:'+id; pendingDel=null; render();
      var gni=$('renameGoal'); if(gni){ gni.focus(); gni.select(); }
      break;
    case 'save-goal-name':
      var gname=val('renameGoal'), gg=goalById(id);
      if(!gname){ toast('目标名不能为空'); return; }
      if(gg) gg.name=gname;
      openAdd=null; save(); render(); toast('目标名字改好了，任务都在');
      break;
    case 'cancel-goal-rename': openAdd=null; render(); break;
    case 'open-plan': openPlan(id); break;
    case 'set-plan': setPlan(id,el.getAttribute('data-date')); break;
    case 'set-custom-plan': setPlan(id,val('planDate')); break;
    case 'open-adjust': openAdjust(id); break;
    case 'save-adjust':
      var ad=byId(id); if(!ad) return;
      var an=val('adjTitle'), am=parseInt(val('adjMins'),10), adate=val('adjDate');
      if(!an){ toast('给任务留个名字'); return; }
      if(am<5||am>600){ toast('预计时间填 5 到 600 分钟'); return; }
      var oldPlan=ad.planDate;
      ad.title=an; ad.mins=am; ad.first=val('adjFirst')||'先做最小的一步';
      ad.planDate=adate; ad.slot=adate===TODAY?'today':'pool';
      state.history.push({id:uid('h'),type:'adjust',taskId:id,title:an,date:localStamp(),from:oldPlan,to:adate,note:'缩小或调整了方案'});
      syncDayStats(oldPlan); syncDayStats(adate); save(); closeModal(); render();
      toast('方案已调整 · 没扣分，按新的来');
      break;
    case 'shrink-adjust':
      var sa=byId(id); if(!sa) return;
      sa.mins=15; if(!sa.title.match(/15 分钟/)) sa.title='用 15 分钟开始：'+sa.title;
      save(); closeModal(); render(); toast('已缩成 15 分钟，先开始就好');
      break;
    case 'prep-adjust':
      var pa=byId(id); if(!pa) return;
      state.tasks.push({id:uid('t'),g:pa.g,stage:pa.stage,title:'准备：'+pa.title,mins:15,
        first:'只准备要用的东西，不求完成',slot:'pool',planDate:dOff(1),done:false,doneDate:'',steps:[],deps:[],from:'manual'});
      save(); closeModal(); render(); toast('已加一件 15 分钟准备任务，安排在明天');
      break;
    case 'close-modal': closeModal(); break;
    case 'noop': break;
    case 'new-journal': openJournal(null); break;
    case 'edit-journal': openJournal(id); break;
    case 'pick-mood':
      var mbs=document.querySelectorAll('#moodRow button');
      for(var mi=0;mi<mbs.length;mi++) mbs[mi].classList.toggle('on',mbs[mi]===el);
      break;
    case 'save-journal': saveJournal(); break;
    case 'toggle-journal-all': journalAll=!journalAll; render(); break;
    case 'del-journal':
      if(pendingDel!=='j:'+id){ pendingDel='j:'+id; render(); toast('再点一次删除这条心得'); }
      else { state.journal=state.journal.filter(function(j){ return j.id!==id; }); pendingDel=null; save(); render(); toast('心得已删除'); }
      break;
    case 'toggle': toggleTask(id); break;
    case 'step':
      var t=byId(id), i=parseInt(el.getAttribute('data-i'),10);
      if(t && t.steps[i]){ t.steps[i].done=!t.steps[i].done; save(); render(); }
      break;
    case 'unslot':
      var u=byId(id);
      if(u){ var od=u.planDate; u.planDate=''; u.slot='pool'; syncDayStats(od); save(); render(); toast('已移出日程，任务和完成记录都保留'); }
      break;
    case 'del-task':
      if(pendingDel!=='t:'+id){ pendingDel='t:'+id; render(); toast('再点一次确认删除'); }
      else {
        state.tasks=state.tasks.filter(function(x){ return x.id!==id; });
        if(selId===id) selId=null;
        pendingDel=null; save(); render(); toast('已删除');
      }
      break;
    case 'del-goal':
      var gk='g:'+id;
      if(pendingDel!==gk){ pendingDel=gk; render(); toast('再点一次，目标和它的任务一起消失'); }
      else {
        state.tasks=state.tasks.filter(function(x){ return x.g!==id; });
        state.goals=state.goals.filter(function(x){ return x.id!==id; });
        pendingDel=null; save(); render(); toast('目标已删除');
      }
      break;
    case 'open-goal-form': openForm='goal'; render(); break;
    case 'close-form': openForm=null; render(); break;
    case 'add-goal':
      var n=val('fName');
      if(!n){ toast('先写目标名'); return; }
      var ngid=uid('g'), fst=uid('s');
      state.goals.push({id:ngid,name:n,due:val('fDue'),reward:val('fReward'),note:'',type:'',
        stages:[{id:fst,name:'阶段 1'}]});
      openForm=null; openStage=fst; openAdd='pt:'+fst; save(); render(); toast('目标已加上，先往里加几件');
      var gin=$('ptName'); if(gin) gin.focus();
      break;
    case 'decompose': decompose(); break;
    case 'sel':
      selId = (selId===id) ? null : id;
      render();
      break;
    case 'a-done': if(selId) toggleTask(selId); break;
    case 'a-today':
      var at=byId(selId);
      if(at){
        if(at.slot==='today'){ at.slot='pool'; toast('已移回池子'); }
        else if(todayTasks().length>=CAP){ toast('今天满了，先移回一件'); }
        else { at.slot='today'; toast('放到今天了'); }
        save(); render();
      }
      break;
    case 'a-del':
      if(selId){
        state.tasks=state.tasks.filter(function(x){ return x.id!==selId; });
        selId=null; save(); render(); toast('已删除');
      }
      break;
    case 'undo-run': undoRun(); break;

    /* ----- 阶段 ----- */
    case 'open-stage':
      openStage = (openStage===id) ? null : id;
      openAdd=null; pendingDel=null; render(); break;
    case 'open-pt':
      openStage=el.getAttribute('data-sid');
      openAdd='pt:'+openStage; pendingDel=null; render();
      var pin=$('ptName'); if(pin) pin.focus();
      break;
    case 'add-pt':
      var asid=el.getAttribute('data-sid'), agid=el.getAttribute('data-gid');
      var atx=val('ptName');
      if(!atx){ toast('先写一件要做的事'); return; }
      state.tasks.push({ id:uid('t'), g:agid, stage:asid, title:atx, mins:30,
        first:'先做最小的一步', slot:'pool', planDate:'', doneDate:'', done:false, steps:[], deps:[], from:'manual' });
      save(); openAdd='pt:'+asid; openStage=asid; render();
      var pin2=$('ptName'); if(pin2) pin2.focus();
      toast('加上了');
      break;
    case 'rename-stage':
      openStage=el.getAttribute('data-sid'); openAdd='rename:'+openStage; pendingDel=null; render();
      var rni=$('renameStage'); if(rni){ rni.focus(); rni.select(); }
      break;
    case 'cancel-rename': openAdd=null; render(); break;
    case 'save-stage-name':
      var rsid=el.getAttribute('data-sid'), rg=goalById(el.getAttribute('data-gid'));
      var rname=val('renameStage');
      if(!rname){ toast('阶段名不能为空'); return; }
      if(rg) rg.stages.forEach(function(st){ if(st.id===rsid) st.name=rname; });
      openAdd=null; save(); render(); toast('阶段名字改好了，进度没变');
      break;
    case 'open-stage-form':
      openAdd='stage:'+el.getAttribute('data-gid'); pendingDel=null; render();
      var sin=$('stName'); if(sin) sin.focus();
      break;
    case 'add-stage':
      var sgoal=goalById(el.getAttribute('data-gid'));
      var sname=val('stName');
      if(!sgoal) return;
      if(!sname){ toast('给阶段起个名字'); return; }
      var nsid=uid('s');
      sgoal.stages.push({ id:nsid, name:sname, parent:null });
      openAdd='pt:'+nsid; openStage=nsid; save(); render(); toast('阶段加上了，先加一件');
      var nin=$('ptName'); if(nin) nin.focus();
      break;
    case 'open-sub-form':
      openStage=el.getAttribute('data-sid');
      openAdd='substage:'+openStage; pendingDel=null; render();
      var subin=$('subName'); if(subin) subin.focus();
      break;
    case 'add-sub-stage':
      var pgoal=goalById(el.getAttribute('data-gid')), psid=el.getAttribute('data-sid');
      var subname=val('subName');
      if(!pgoal) return;
      if(!subname){ toast('给子阶段起个名字'); return; }
      var ssid=uid('s');
      pgoal.stages.push({ id:ssid, name:subname, parent:psid });
      openAdd='pt:'+ssid; openStage=ssid; save(); render(); toast('子阶段加上了，先加一件');
      var subnin=$('ptName'); if(subnin) subnin.focus();
      break;
    case 'toggle-pt':
      var pt=byId(id);
      if(pt&&pt.planDate){ toggleTask(id); }
      else if(pt){
        pt.done=!pt.done;
        if(pt.done){
          pt.doneDate=TODAY; historyDone(pt,TODAY);
          var pg=goalById(pt.g);
          var ps=pg?subtreeTasks(pg,pt.stage):[];
          var msg='进度往前走了一格 · 安排到日程才计分';
          if(ps.length&&ps.every(function(x){return x.done;})) msg='这个阶段走完了 · 你完成的是一整段路';
          if(pg&&gStats(pg).n===gStats(pg).d&&gStats(pg).n>0) msg='目标已达成 · 这段长期投入有了结果';
          toast(msg);
        }
        else { pt.doneDate=''; historyUndone(pt); toast('已撤销进度'); }
        save(); render();
      }
      break;
    case 'pt-today': openPlan(id); break;
    case 'del-pt':
      if(pendingDel!=='pt:'+id){ pendingDel='pt:'+id; render(); toast('再点一次删掉'); }
      else {
        state.tasks=state.tasks.filter(function(x){ return x.id!==id; });
        pendingDel=null; save(); render(); toast('已删除');
      }
      break;
    case 'del-stage':
      var dsid=el.getAttribute('data-sid');
      if(pendingDel!=='s:'+dsid){ pendingDel='s:'+dsid; render(); toast('再点一次，这个分支和里面的任务一起删'); }
      else {
        var dgoal=goalById(el.getAttribute('data-gid'));
        var delIds=dgoal?subtreeIds(dgoal,dsid):[dsid], delMap={};
        delIds.forEach(function(i){ delMap[i]=1; });
        if(dgoal) dgoal.stages=dgoal.stages.filter(function(x){ return !delMap[x.id]; });
        state.tasks=state.tasks.filter(function(x){ return !delMap[x.stage]; });
        if(delMap[openStage]) openStage=null;
        pendingDel=null; save(); render(); toast('阶段已删除');
      }
      break;
    case 'export': exportData(); break;
    case 'import': $('fileIn').click(); break;

    /* ----- 云同步 ----- */
    case 'open-cloud': openCloud(); break;
    case 'close-cloud': $('cloudHost').innerHTML=''; break;
    case 'cloud-save':
      var cu=val('cfUrl').replace(/\/+$/,''), ck=val('cfKey'), ct=val('cfTable')||'ledger';
      if(!cu || !ck){ toast('地址和 Key 都要填'); return; }
      if(cu.indexOf('http')!==0){ toast('地址要以 https:// 开头'); return; }
      keepCfg({url:cu,key:ck,table:ct});
      $('cloudHost').innerHTML='';
      bootCloud();
      toast('正在连接…');
      break;
    case 'cloud-push':
      pushCloud().then(function(ok){ toast(ok?'已上传到云端':'上传失败，看控制台'); });
      break;
    case 'cloud-pull':
      pullCloud().then(function(row){
        if(row && applyRemote(row.data)){ setSyn('ok'); toast('已从云端拉取'); }
        else toast('云端还没有数据');
      });
      break;
    case 'cloud-off':
      keepCfg(null); $('cloudHost').innerHTML=''; setSyn('off');
      toast('已断开，数据还在本地');
      break;
    case 'save-note': state.note=val('noteInput'); save(); toast('存进下周了'); break;
  }
});

document.addEventListener('keydown',function(e){
  if(e.key!=='Enter' || !e.target) return;
  var kid=e.target.id;
  if(kid==='goalText'){ decompose(); return; }
  if(kid==='ptName'){ e.preventDefault(); var b1=document.querySelector('[data-act="add-pt"]'); if(b1) b1.click(); return; }
  if(kid==='stName'){ e.preventDefault(); var b2=document.querySelector('[data-act="add-stage"]'); if(b2) b2.click(); return; }
  if(kid==='subName'){ e.preventDefault(); var b5=document.querySelector('[data-act="add-sub-stage"]'); if(b5) b5.click(); return; }
  if(kid==='renameStage'){ e.preventDefault(); var b3=document.querySelector('[data-act="save-stage-name"]'); if(b3) b3.click(); return; }
  if(kid==='renameGoal'){ e.preventDefault(); var b4=document.querySelector('[data-act="save-goal-name"]'); if(b4) b4.click(); return; }
});
document.addEventListener('change',function(e){
  if(e.target && e.target.id==='fileIn' && e.target.files[0]) importData(e.target.files[0]);
});

/* 首次渲染 + 日期滚动 */
function rollDate(){
  var t=dOff(0);
  if(state.today!==t){
    var prev=state.today;
    var y=state.tasks.filter(function(x){ return x.planDate===prev&&x.done; }).length;
    state.weekLog[prev]=y;
    state.tasks.forEach(function(x){ if(x.slot==='today') x.slot='pool'; });
    state.today=t;
    if(viewDate===prev) viewDate=t;
    save();
  }
}
rollDate();
render();
if(navigator.storage && navigator.storage.persist){
  try{ navigator.storage.persist(); }catch(e){}
}
bootCloud();
window.addEventListener('resize',function(){ if(VIEW==='decompose') render(); });

})();
</script>
</body>
</html>
